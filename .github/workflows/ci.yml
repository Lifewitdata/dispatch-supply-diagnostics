name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests, including SQL and notebook execution
        run: python -m pytest -q

      - name: Regenerate SQL outputs
        run: python python/01_run_sql_pipeline.py

      - name: Check committed outputs are current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- data/processed)" ]; then
            git status --short -- data/processed
            exit 1
          fi
